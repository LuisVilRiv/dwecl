<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 9 - Revertir una cadena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Ejercicio 9</h1>
    <p class="enunciado">Escribe una función que tome una cadena como argumento y devuelva la cadena invertida. Usa split() para convertir la cadena en un arreglo, reverse() para invertirlo y join() para unirlo de nuevo.</p>
    <label for="cadena">Cadena</label>
    <input type="text" id="cadena" value="Hola mundo">
    <button id="btnRevertir">Revertir</button>
    <div id="resultado" class="resultado"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
