<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 21 - Filtrar números mayores que un valor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Ejercicio 21</h1>
    <p class="enunciado">Escribe una función que tome un array de números y un valor, y devuelva un nuevo array con los números que son mayores que ese valor. Usa filter() para crear el nuevo array.</p>
    <label for="lista">Números separados por comas</label>
    <input type="text" id="lista" value="5, 12, 8, 21, 3, 15">
    <label for="valor">Valor de referencia</label>
    <input type="number" id="valor" value="10">
    <button id="btnFiltrar">Filtrar</button>
    <div id="resultado" class="resultado"></div>
  </main>
  <script src="script.js"></script>
  <script src="../assets/script-viewer.js"></script>
</body>
</html>
