<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 10 - Número más grande de un array</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Ejercicio 10</h1>
    <p class="enunciado">Crea una función que encuentre el número más grande en un array. Usa Math.max() y el operador ... para expandir el array.</p>
    <label for="lista">Números separados por comas</label>
    <input type="text" id="lista" value="4, 17, 9, 23, 8">
    <button id="btnMax">Buscar el mayor</button>
    <div id="resultado" class="resultado"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
