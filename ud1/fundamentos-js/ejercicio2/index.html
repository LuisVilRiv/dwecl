<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2 - Array de 100 números aleatorios y filtrado por rango</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Ejercicio 2</h1>
    <p class="enunciado">Declara un array de 100 números. Rellena el array con valores al azar. Muestra el contenido con console.table. Realiza un filtrado de datos, por ejemplo mostrando los valores de un determinado rango.</p>
    <label for="min">Mínimo del rango</label>
    <input type="number" id="min" value="40">
    <label for="max">Máximo del rango</label>
    <input type="number" id="max" value="60">
    <button id="btnFiltrar">Filtrar</button>
    <div id="resultado" class="resultado"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
