<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 20 - Convertir una cadena a mayúsculas y minúsculas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Ejercicio 20</h1>
    <p class="enunciado">Escribe una función que convierta una cadena de texto a mayúsculas y luego a minúsculas, mostrando ambos resultados. Usa toUpperCase() y toLowerCase().</p>
    <label for="cadena">Texto</label>
    <input type="text" id="cadena" value="Desarrollo de Aplicaciones Web">
    <button id="btnConvertir">Convertir</button>
    <div id="resultado" class="resultado"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
