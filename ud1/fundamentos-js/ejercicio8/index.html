<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 8 - Número aleatorio entero en un intervalo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Ejercicio 8</h1>
    <p class="enunciado">Escribe una función que permita generar un número aleatorio entero entre un intervalo. Por ejemplo azar(-5, 10). Salida: 3.</p>
    <label for="min">Mínimo</label>
    <input type="number" id="min" value="-5">
    <label for="max">Máximo</label>
    <input type="number" id="max" value="10">
    <button id="btnAzar">Generar</button>
    <div id="resultado" class="resultado"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
