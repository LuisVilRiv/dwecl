<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 15 - Números primos en un rango</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Ejercicio 15</h1>
    <p class="enunciado">Escribe un programa que imprima todos los números primos entre 1 y un número dado por el usuario. Crea una función llamada esPrimo(num) que reciba num, un número entero.</p>
    <label for="limite">Número límite</label>
    <input type="number" id="limite" value="50" min="2">
    <button id="btnPrimos">Mostrar primos</button>
    <div id="resultado" class="resultado"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
