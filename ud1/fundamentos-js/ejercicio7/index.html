<!DOCTYPE html>
<html lang="es">
<head>

  <title>Ejercicio 7 - Contar vocales en una palabra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Ejercicio 7</h1>

    <label for="palabra">Palabra</label>

    <button id="btnContar">Contar vocales</button>

  </main>
