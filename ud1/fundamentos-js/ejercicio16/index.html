<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 16 - Convertir grados Celsius a Fahrenheit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Ejercicio 16</h1>
    <p class="enunciado">Escribe una función que convierta grados Celsius a Fahrenheit. Fórmula: Fahrenheit = (Celsius * 9/5) + 32.</p>
    <label for="celsius">Grados Celsius</label>
    <input type="number" id="celsius" value="25" step="any">
    <button id="btnConvertir">Convertir</button>
    <div id="resultado" class="resultado"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
